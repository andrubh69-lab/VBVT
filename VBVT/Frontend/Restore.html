<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Restaurar Clave</title>
<link rel="stylesheet" href="css/Restore.css">
<link rel="preload" href="styles.css" as="style">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <img src="img/logotipo.png" class="logo">

        <!-- ID -->
        <input 
        type="text" 
        id="idUsuario"
        placeholder="Ingrese su ID"
        pattern="[0-9]{6,12}"
        minlength="6"
        maxlength="12"
        required>

        <!-- Fecha de nacimiento -->
        <input 
        type="date"
        id="fechaNacimiento"
        required>

        <!-- Correo -->
        <input 
        type="email"
        id="correo"
        placeholder="Ingrese su correo electrónico"
        required>

        <button onclick="restaurarClave()">Restaurar clave</button>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
