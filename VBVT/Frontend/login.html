<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="css/login.css">
<link rel="preload" href="styles.css" as="style">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <img src="img/Logotipo.png" class="logo">

        <input id="user" placeholder="Ingrese el usuario">

        <div class="password-box">
            <input id="pass" type="password" placeholder="Ingrese la clave">
        </div>

        <button onclick="login()">Login</button>
        <span class="help">?</span>
        

        <div class="links">
            <a href="Restore.html">Restaurar clave</a>
            <a href="active.html">Activar usuario</a>
        </div>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
