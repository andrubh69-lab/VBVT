<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VetBullcanVet</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Logotipo.ico">
    <link rel="preload" href="styles.css" as="style">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
    <h1>Veterinaria VetBullcanVet</h1>
</header>

<nav>
    <button onclick="mostrar('productos')">Productos</button>
    <button onclick="mostrar('mascotas')">Estado de Mascotas</button>
    <button onclick="mostrar('citas')">Citas</button>
    <button onclick="window.location.href='Frontend/login.html'">Inicio / Acceso</button>
    <button onclick="window.location.href='Frontend/Inventario.html'">Inventario</button>
</nav>

<section id="productos">
    <div class="card">
        <h2>Productos para Compra</h2>
        <ul id="listaProductos"></ul>
        <button onclick="agregarProducto()">Agregar Producto de Ejemplo</button>
    </div>
</section>

<section id="mascotas">
    <div class="card">
        <h2>Estado de Mascotas</h2>
        <table>
            <tr><th>Nombre</th><th>Estado</th></tr>
            <tr><td>Firulais</td><td>En consulta</td></tr>
            <tr><td>Michi</td><td>Recuperación</td></tr>
        </table>
    </div>
</section>

<section id="citas">
    <div class="card">
        <h2>Gestión de Citas</h2>
        <input type="date">
        <input type="time">
        <input type="text" placeholder="Nombre de la mascota">
        <button>Agendar Cita</button>
    </div>
</section>

<script>
    function mostrar(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function agregarProducto() {
        const lista = document.getElementById('listaProductos');
        const item = document.createElement('li');
        item.textContent = 'Alimento Premium - $25';
        lista.appendChild(item);
    }

    function agregarInventario() {
        const tabla = document.getElementById('tablaInventario');
        const fila = tabla.insertRow();
        fila.insertCell(0).textContent = 'Nuevo Producto';
        fila.insertCell(1).textContent = '10';
    }
</script>

</body>
</html>
